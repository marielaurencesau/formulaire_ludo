<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Page Inscription</title>
</head>
 
<body>
    <main class="container py-5">
        <div class="row">
            <div class="col-12 col-lg-8">
                <form method="post" action="merci.html" class="formulaire-jeu ">
                    <fieldset class="mb-5">
                        <legend class="h4 fw-bold border-bottom pb-2 mb-4">Le Jeu</legend>
                        <div class="mb-3">
                            <label class="form-label" for="titre">Titre du jeu :</label>
                            <input class="form-control" type="text" name="titre" id="titre" minlength="2" maxlength="80"
                                placeholder="Fortnite" required>
                        </div>
 
                        <div class="mb-3">
                            <label class="form-label" for="annee">Annee de sortie :</label>
                            <input class="form-control" type="number" name="annee" id="annee" min="1960" max="2026"
                                step="1" placeholder="1999" required>
                        </div>
 
                        <div class="mb-3">
                            <label class="form-label" for="genre">Genre : </label>
                            <select class="form-select" name="genre" id="genre">
                                <option value=""> Choisissez un genre ...</option>
                                <option value="action">Action</option>
                                <option value="horreur">Horreur</option>
                                <option value="aventure">Aventure</option>
                                <option value="detente">Detente</option>
                                <option value="autre">Autre</option>
                            </select>
                        </div>
                    </fieldset>
 
                    <fieldset class="mb-3">
                        <legend class="form-label mb-2">Plateforme</legend>
 
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="pc" name="plateforme" value="pc">
                            <label class="form-check-label" for="pc">PC</label>
                        </div>
 
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="ps5" name="plateforme" value="ps5">
                            <label class="form-check-label" for="pc">PS5</label>
                        </div>
 
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="switch" name="plateforme"
                                value="switch">
                            <label class="form-check-label" for="pc">Nintendo Switch</label>
                        </div>
                    </fieldset>
 
                    <div>
                        <label class="form-label" for="commentaire">Pourquoi ce jeu?</label>
                        <textarea class="form-control" name="commentaire" id="commentaire" rows="5" minlength="10"
                            maxlength="600" placeholder="Ce qui vous a marquer, a qui vous le conseiller?"
                            required></textarea>
                        <div class="form-text">entre 10 et 600 caracteres</div>
                    </div>
                    <button class="btn btn-success btn-lg" type="submit">Proposer un jeu</button>
                </form>
            </div>
        </div>
    </main>
 
</body>
 
</html>
